name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*MARKETING_VERSION:[[:space:]]*"\(.*\)".*/\1/p' project.yml | head -1)
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::MARKETING_VERSION in project.yml must be a quoted X.Y.Z, got '$VERSION'"; exit 1; }
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already released — skipping build."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW="$(uuidgen)"

          echo "$CERT_B64" | base64 --decode > "$CERT"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$CERT" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security find-certificate -c "Glosso Self-Signed" -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning

      - name: Build & package
        run: |
          brew install xcodegen
          scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release create "$TAG" \
            .build/release/Glosso.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  update-site:
    needs: [check, release]
    if: >-
      ${{ always() && !cancelled() && needs.check.result == 'success' &&
          (needs.release.result == 'success' ||
           (needs.release.result == 'skipped' && needs.check.outputs.released == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Update download links on site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Unexpected release tag: $TAG"
              exit 1
            fi
            sed -i -E "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Glosso\.zip#releases/download/$TAG/Glosso.zip#g" docs/index.html docs/en/index.html
            if git diff --quiet -- docs/index.html docs/en/index.html; then
              echo "Download links already at $TAG — nothing to do."
              exit 0
            fi
            git add docs/index.html docs/en/index.html
            git commit -m "docs(site): point download links at $TAG"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt $attempt; refreshing main before retry."
          done
          echo "::error::Could not update download links after three attempts. Rerun the workflow to retry."
          exit 1
